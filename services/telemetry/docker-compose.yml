# Servicio de telemetría, desplegado como Compose y no como Application.
#
# El motivo es la red: necesita estar en DOS a la vez.
#
#   · dokploy-network            — para que Traefik le dé el dominio público
#   · red del stack propio       — para alcanzar la base de datos
#
# La alternativa era meter la base de datos en dokploy-network, pero eso la abre
# a todos los contenedores del servidor (WordPress, Moodle, n8n). Es más
# estrecho que entre el servicio de telemetría.
#
# El nombre de la red lleva el sufijo del proyecto de Dokploy, así que cambia si
# el stack se recrea. Si un día la telemetría deja de escribir con un 503,
# comprobar esto primero:
#   docker inspect fluxion-sb-db --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'

services:
  telemetry:
    build:
      # El contexto es la raíz del monorepo, como en todos los servicios.
      context: ../..
      dockerfile: services/telemetry/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8388608}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
    expose:
      - "8000"
    networks:
      - dokploy-network
      - supabase
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
  supabase:
    external: true
    name: fluxion-saas-supabase-0mity8_default
